<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Pedidos - Cafetería</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="../css/style.css" rel="stylesheet">
    <script src="../js/pedidos.js" defer></script>
</head>
<body class="bg-light">
    <div class="container mt-5">
        <h1 class="text-center mb-4">Cafetería ESEN - Gestión de Pedidos</h1>
        
        <div class="row">
            <div class="col-md-4">
                <div class="card p-3 shadow-sm">
                    <h4>Nuevo Pedido</h4>
                    <form id="formPedido">
                        <div class="mb-3">
                            <label>Producto</label>
                            <input type="text" id="inputProducto" class="form-control" placeholder="Ej: Café americano">
                        </div>
                        <div class="mb-3">
                            <label>Precio Unitario ($)</label>
                            <input type="number" id="inputPrecio" class="form-control" step="0.01" placeholder="0.00">
                        </div>
                        <div class="mb-3">
                            <label>Cantidad</label>
                            <input type="number" id="inputCantidad" class="form-control" placeholder="0">
                        </div>
                        <button type="submit" id="btnAgregar" class="btn btn-primary w-100">Agregar pedido</button>
                    </form>
                </div>
                
                <div class="card p-3 shadow-sm mt-3 mb-3">
                    <h4>Filtros</h4>
                    <div class="mb-2">
                        <input type="number" id="inputFiltroPrecio" class="form-control" placeholder="Precio máximo">
                    </div>
                    <button id="btnFiltrar" class="btn btn-secondary w-100 mb-2">Filtrar productos</button>
                    <button id="btnMostrarTodos" class="btn btn-info w-100 mb-2 text-white">Mostrar todos</button>
                    <button id="btnLimpiar" class="btn btn-danger w-100">Limpiar pedidos</button>
                </div>
            </div>

            <div class="col-md-8">
                <div class="card p-3 shadow-sm">
                    <table class="table table-hover">
                        <thead class="table-dark">
                            <tr>
                                <th>Producto</th>
                                <th>Precio Unitario</th>
                                <th>Cantidad</th>
                                <th>Subtotal</th>
                            </tr>
                        </thead>
                        <tbody id="tablaCuerpo">
                        </tbody>
                    </table>
                    
                    <div class="alert alert-success d-flex justify-content-between">
                        <strong>Total Unidades: <span id="totalUnidades">0</span></strong>
                        <strong>Monto Total: $<span id="montoTotal">0.00</span></strong>
                    </div>
                </div>
                <div class="mt-3">
                    <a href="../../guia5.html" class="btn btn-dark w-100 text-center text-white" style="display: block; padding: 10px; border-radius: 5px; text-decoration: none;">Regresar a la Guía 5</a>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
