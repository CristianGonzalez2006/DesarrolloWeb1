<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shareholders - Berkshire Hathaway</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav class="fade-in-up">
        <a href="index.html" class="logo">Berkshire Hathaway</a>
        <div class="nav-links">
            <a href="index.html">Company</a>
            <a href="empresas.html">Our Businesses</a>
            <a href="accionistas.html">Shareholders</a>
        </div>
    </nav>

    <div class="container fade-in-up">
        <div class="grid-2">
            <div>
                <h1>Information that matters.</h1>
                <p class="subhead" style="margin: 24px 0 40px; max-width: 450px;">Access Berkshire Hathaway's most important shareholder resources, SEC filings, and annual meeting details.</p>
            </div>

            <form class="fade-in-up delay-1" style="background-color: var(--color-paper-white); border-radius: var(--radius-cards); padding: 40px; box-shadow: var(--shadow-subtle);">
                <h2 style="font-size: 26px; margin-bottom: 24px;">Investor Inquiries</h2>
                <input type="text" class="input-composer" placeholder="Full Name..." required>
                <input type="email" class="input-composer" placeholder="Email Address..." required>
                <textarea class="input-composer" placeholder="How can we assist you?..." rows="4" required></textarea>
                <button type="submit" class="btn btn-filled" style="width: 100%;">Send Request</button>
            </form>
        </div>
    </div>
</body>
</html>
