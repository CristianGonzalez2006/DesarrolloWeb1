<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Validación con Expresiones Regulares</title>
  <link href="../bootstrap/css/bootstrap.min.css" rel="stylesheet" />
  <link href="../bootstrap/icons/bootstrap-icons.css" rel="stylesheet" />
</head>
<body class="bg-light">
  <div class="container py-5">
    <div class="row justify-content-center">
      <div class="col-md-8 shadow-lg p-4 bg-body rounded border-top border-primary border-4">
        <h3 class="mb-4 text-primary"><i class="bi bi-person-badge"></i> Ficha de Estudiante (Validaciones Regex)</h3>
        
        <div id="idAlerta" class="alert d-none" role="alert"></div>

        <form id="formEstudiante" onsubmit="return false">
          
          <div class="row mb-3">
            <div class="col-md-6">
              <label class="form-label fw-bold">Carnet</label>
              <input type="text" class="form-control" id="txtCarnet" placeholder="Ej: AB001">
              <div class="form-text">Dos letras y tres números.</div>
            </div>
            <div class="col-md-6">
              <label class="form-label fw-bold">Nombre Completo</label>
              <input type="text" class="form-control" id="txtNombre" placeholder="Solo letras y espacios">
            </div>
          </div>

          <div class="row mb-3">
            <div class="col-md-6">
              <label class="form-label fw-bold">DUI</label>
              <input type="text" class="form-control" id="txtDUI" placeholder="########-#">
            </div>
            <div class="col-md-6">
              <label class="form-label fw-bold">NIT</label>
              <input type="text" class="form-control" id="txtNIT" placeholder="####-######-###-#">
            </div>
          </div>

          <div class="row mb-3">
            <div class="col-md-4">
              <label class="form-label fw-bold">Fecha de Nacimiento</label>
              <input type="text" class="form-control" id="txtFecha" placeholder="DD/MM/AAAA">
            </div>
            <div class="col-md-5">
              <label class="form-label fw-bold">Correo Electrónico</label>
              <input type="text" class="form-control" id="txtCorreo" placeholder="ejemplo@correo.com">
            </div>
            <div class="col-md-3">
              <label class="form-label fw-bold">Edad</label>
              <input type="text" class="form-control" id="txtEdad" placeholder="Solo números">
            </div>
          </div>

          <button type="button" class="btn btn-primary w-100 mt-3 fs-5" id="btnValidar">
            <i class="bi bi-check-circle"></i> Validar Información
          </button>
        </form>

      </div>
    </div>
  </div>

  <script src="../js/validaciones.js"></script>
</body>
</html>
